name: Cross-platform CI

on:
  push:
    branches:
      - main
      - "code/**"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - "winget/**"
      - "analytics-worker/**"
      - ".github/workflows/collect-traffic.yml"
      - ".github/scripts/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - "winget/**"
      - "analytics-worker/**"
      - ".github/workflows/collect-traffic.yml"
      - ".github/scripts/**"

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libssl-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Select the stable Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked
