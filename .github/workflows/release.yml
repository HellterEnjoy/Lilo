name: Release

# One workflow builds every package in parallel, then publishes a single GitHub
# release with all assets and finally submits the WinGet update.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.3
        required: true
        type: string
      publish_winget:
        description: Submit a WinGet update after publishing the release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPENDENCIES: >-
    libssl-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev
    libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config

jobs:
  prepare:
    name: Verify tag and version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve and verify version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Release tag '$tag' must use the vX.Y.Z format." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          cargo_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "Tag version '$version' does not match Cargo.toml version '$cargo_version'." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows package
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build ZIP and installer
        shell: pwsh
        run: .\scripts\package-windows.ps1

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  ubuntu:
    name: Ubuntu 22.04 package
    needs: prepare
    runs-on: ubuntu-22.04

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes $LINUX_DEPENDENCIES

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ubuntu-22.04
        run: bash scripts/package-linux.sh

      - name: Upload Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: dist/*.tar.gz*
          if-no-files-found: error

  arch:
    name: Arch Linux package
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: archlinux:base

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel ca-certificates cargo git libxcb libxkbcommon-x11 \
            openssl pkgconf rust wayland

      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: arch
        run: bash scripts/package-linux.sh

      - name: Upload Arch Linux package
        uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, windows, ubuntu, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            notice='> [!WARNING]
          > Lilo is still under active development. Although this release passed automated checks, bugs may remain and some functionality may behave differently or fail on particular systems, desktop environments or vaults. Keep a current vault backup and report reproducible problems through GitHub Issues.'
            gh release create "$TAG" dist/* --title "Lilo $VERSION" \
              --generate-notes --notes "$notice" --verify-tag
          fi

  winget:
    name: Submit WinGet update
    needs: [prepare, publish]
    if: ${{ github.event_name == 'push' || inputs.publish_winget }}
    runs-on: windows-latest
    env:
      WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Submit WinGet update
        if: ${{ env.WINGET_GITHUB_TOKEN != '' }}
        shell: pwsh
        run: |
          .\scripts\submit-winget.ps1 `
            -Version '${{ needs.prepare.outputs.version }}' `
            -Tag '${{ needs.prepare.outputs.tag }}' `
            -Repository '${{ github.repository }}'

      - name: Explain skipped WinGet submission
        if: ${{ env.WINGET_GITHUB_TOKEN == '' }}
        shell: pwsh
        run: Write-Warning 'WINGET_GITHUB_TOKEN is not configured; the release was published, but WinGet was not updated.'
