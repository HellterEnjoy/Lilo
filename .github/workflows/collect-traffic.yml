name: Archive GitHub traffic

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      LILO_ANALYTICS_WORKER_URL: https://lilo-analytics.miaccu23.workers.dev

    steps:
      - name: Check out collector
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch and archive repository traffic
        env:
          GH_TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          LILO_TRAFFIC_INGEST_TOKEN: ${{ secrets.LILO_TRAFFIC_INGEST_TOKEN }}
        run: node .github/scripts/collect-traffic.mjs
