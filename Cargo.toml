[package]
name = "Lilo"
version = "0.2.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
eframe = "0.36.1"
chrono = { version = "0.4.35", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

serde_json = "1.0"
serde-saphyr = "1.0.1"
uuid = { version = "1.24", features = ["v4", "serde"] }
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
egui_extras = { version = "0.36.1", default-features = false, features = ["image", "svg", "gif", "webp"] }

[dev-dependencies]
tempfile = "3.27"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
