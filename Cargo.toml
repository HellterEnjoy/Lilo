[package]
name = "Lilo"
version = "0.1.1"
edition = "2024"

[dependencies]
directories = "6.0.0"
eframe = "0.36.1"
chrono = { version = "0.4.35", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

serde_json = "1.0"
serde-saphyr = "1.0.1"
uuid = { version = "1.24", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
